<!DOCTYPE html>
<html lang="pt" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER_DEX // Terminal de Dados Pokémon (Gerações I - IX)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="cyber-grunge-body text-light">

  <!-- Efeito Scanlines -->
  <div class="crt-overlay" aria-hidden="true"></div>

  <!-- NAVBAR -->
 <header class="sticky-top border-bottom border-cyber py-3">
  <div class="container-fluid px-3 px-md-4">
    <h1 class="font-monospace fw-bold fs-4 text-neon-green mb-0">
      <i class="bi bi-terminal-fill me-2"></i>CYBER_DEX_
    </h1>
  </div>
</header>

  <!-- (MAIN) -->
  <main class="container-fluid px-3 px-md-4 py-4">

   <!-- PESQUISA E FILTROS -->
    <section class="cyber-command-box p-3 mb-4 rounded border-cyber">
      <div class="row g-3 align-items-end">
        
        <!-- Pesquisa -->
        <div class="col-12 col-lg-6 position-relative">
          <div class="input-group cyber-input-group" id="areaPesquisa">
            <span class="input-group-text cyber-prompt-prefix font-monospace">Pesquisar</span>
            <input type="text" id="inputPesquisa" class="form-control cyber-input font-monospace" placeholder="Nome, número ou tipo..." autocomplete="off" spellcheck="false">
            <button class="btn btn-cyber-clear font-monospace px-3 fw-bold" type="button" id="btnLimparPesquisa">X</button>
          </div>

          <!-- Gaveta Tipos -->
          <div id="painelSeletorTipos" class="cyber-type-drawer p-3 rounded border-cyber d-none">
            <div class="d-flex justify-content-between mb-2">
              <span class="text-neon-cyan small fw-bold font-monospace">TIPOS DISPONÍVEIS:</span>
              <button class="btn btn-sm btn-outline-cyber py-0 font-monospace" id="btnFecharPainelTipos">[ X ]</button>
            </div>
            <div class="d-flex flex-wrap gap-2" id="grelhaBotoesTipos"></div>
          </div>
          
          <div id="badgesPesquisaContainer" class="d-flex flex-wrap gap-2 mt-2 position-absolute" style="z-index: 5;"></div>
        </div>

        <!-- Geração -->
        <div class="col-6 col-lg-3">
          <div class="text-secondary small font-monospace mb-1">GERAÇÕES:</div>
          <select id="seletorGeracao" class="form-select cyber-select font-monospace">
            <option value="todas">TODAS (I - IX)</option>
            <option value="1">GEN I (1-151)</option>
            <option value="2">GEN II (152-251)</option>
            <option value="3">GEN III (252-386)</option>
            <option value="4">GEN IV (387-493)</option>
            <option value="5">GEN V (494-649)</option>
            <option value="6">GEN VI (650-721)</option>
            <option value="7">GEN VII (722-809)</option>
            <option value="8">GEN VIII (810-905)</option>
            <option value="9">GEN IX (906-1025)</option>
          </select>
        </div>

        <!-- Registados -->
        <div class="col-6 col-lg-3 text-end font-monospace">
          <div class="text-secondary small mb-1">REGISTADOS:</div>
          <div id="statusRegistos" class="text-neon-green fw-bold fs-6">A carregar...</div>
        </div>

      </div>
    </section>

  <!-- SPINNER DE CARREGAMENTO INICIAL -->
    <div id="loadingTerminal" class="text-center py-5 font-monospace">
      <div class="cyber-spinner mb-3"></div>
      <div class="text-neon-green fs-5 mb-1">&gt; A CARREGAR BASE DE DADOS...</div>
      <div class="text-secondary small">GET /api/v2/pokemon</div>
    </div>

    <!-- MENSAGEM DE ERRO  -->
    <div id="painelErro" class="cyber-alert-danger font-monospace p-3 rounded mb-4 text-center d-none">
      <span class="text-danger fw-bold">[ ERRO DE LIGAÇÃO ]</span>
      <span class="text-light small ms-2">Falha de comunicação com a API. Verifica a internet.</span>
    </div>
    
    <!-- ESTRUTURA MASTER: GRELHA DINÂMICA -->
    <div id="grelha-pokemons" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xxl-6 g-3">
      <!-- O app.js injeta os cartões aqui -->
    </div>

    <!-- PAGINAÇÃO DINÂMICA -->
    <div id="painelCarregarMais" class="text-center my-4 d-none">
      <button id="btnCarregarMais" class="btn btn-cyber-more font-monospace py-2 px-4">
        [ + CARREGAR MAIS ]
      </button>
      <div id="contadorLote" class="font-monospace text-secondary small mt-2"></div>
    </div>

  </main>

 <!-- 3. ESTRUTURA DETAIL: MODAL NATIVO BOOTSTRAP 5 -->
  <div class="modal fade" id="modalDetalhes" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content cyber-modal-content border-cyber">
        
        <div class="modal-header border-cyber bg-black">
          <h2 class="modal-title font-monospace text-neon-green h6 mb-0 d-flex align-items-center">
            <span class="cyber-record-light me-2"></span>DETALHES
          </h2>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <!-- Corpo Dinâmico do Modal -->
        <div class="modal-body p-3 p-md-4 bg-black" id="modalCorpo"></div>

      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
